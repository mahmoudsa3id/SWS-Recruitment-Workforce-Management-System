
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="description"
    content="SWS - نظام إدارة الشركة والموظفين والحسابات والمسافرين"
  >

  <meta name="theme-color" content="#176B50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >
  <meta name="apple-mobile-web-app-title" content="SWS">

  <!-- أيقونة الموقع -->
  <link
    rel="icon"
    type="image/png"
    href="images/sws-logo.png"
  >

  <!-- أيقونة أجهزة Apple -->
  <link
    rel="apple-touch-icon"
    href="images/sws-logo.png"
  >

  <!-- إعدادات التطبيق -->
  <link rel="manifest" href="manifest.json">

  <title>SWS | نظام إدارة الشركة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f7faf8;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top,
          #e9f5ef 0%,
          #f7faf8 55%,
          #ffffff 100%
        );
      transition: opacity 0.35s ease;
    }

    .loading-content {
      width: min(90%, 360px);
      text-align: center;
      padding: 30px 20px;
    }

    .app-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      overflow: hidden;
      border-radius: 26px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(23, 107, 80, 0.14);
    }

    .app-logo img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 8px;
      object-fit: contain;
    }

    .app-name {
      margin: 0 0 10px;
      color: #176b50;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .app-description {
      margin: 0 0 28px;
      color: #64756d;
      font-size: 14px;
      line-height: 1.8;
    }

    .loading-track {
      width: 180px;
      height: 4px;
      margin: 0 auto 14px;
      overflow: hidden;
      border-radius: 20px;
      background: #dcebe3;
    }

    .loading-progress {
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #176b50;
      animation: loading 1.2s ease-in-out infinite;
    }

    .loading-text {
      margin: 0;
      color: #718078;
      font-size: 12px;
    }

    @keyframes loading {
      0% {
        transform: translateX(250%);
      }

      100% {
        transform: translateX(-250%);
      }
    }

    #app-loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- شاشة التحميل قبل ظهور تطبيق Flutter -->
  <div id="app-loading">
    <div class="loading-content">

      <div class="app-logo">
        <img
          src="images/sws-logo.png"
          alt="شعار SWS"
          onerror="this.style.display='none';"
        >
      </div>

      <h1 class="app-name">SWS</h1>

      <p class="app-description">
        نظام إدارة الشركة والموظفين والحسابات
      </p>

      <div class="loading-track">
        <div class="loading-progress"></div>
      </div>

      <p class="loading-text">
        جاري تحميل النظام...
      </p>

    </div>
  </div>

  <!-- تشغيل تطبيق Flutter -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');

      if (loading) {
        loading.classList.add('hide');

        setTimeout(function () {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }

          document.body.style.overflow = 'auto';
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
