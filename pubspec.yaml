name: "sws_staff"
description: "SWS Admin Finance and Traveler Management"
publish_to: "none"
version: "1.0.0+1"
environment:
  sdk: ">=3.12.0 <4.0.0"
dependencies:
  archive: ^3.6.1
  cross_file: ^0.3.4+2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  excel: ^4.0.6
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  geolocator: ^14.1.1
  get_it: 9.3.0
  inno_build: ^0.4.0
  intl: ^0.20.2
  msix: ^3.18.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: 5.14.3
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.4
  sqflite_common_ffi_web: ^1.1.2
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_lints: "^6.0.0"
  flutter_test:
    sdk: "flutter"
flutter:
  uses-material-design: true
  fonts:
    - family: "NotoSansArabic"
      fonts:
        - asset: "assets/fonts/NotoSansArabic-Regular.ttf"
        - asset: "assets/fonts/NotoSansArabic-Bold.ttf"
          weight: 700
    - family: "NotoKufiArabic"
      fonts:
        - asset: "assets/fonts/NotoKufiArabic-Regular.ttf"
        - asset: "assets/fonts/NotoKufiArabic-Bold.ttf"
          weight: 700
  assets:
    - "assets/fonts/NotoSansArabic-Regular.ttf"
    - "assets/fonts/NotoSansArabic-Bold.ttf"
    - "assets/fonts/NotoKufiArabic-Regular.ttf"
    - "assets/fonts/NotoKufiArabic-Bold.ttf"
msix_confing:
  display_name: "SWS Management"
  publisher_display_name: "Management my company"
  identity_name: com.example.sws
  msix_version: 1.0.0.0
  logo_path: "assets/images/logo.png"
  capalbilities: internetClient
